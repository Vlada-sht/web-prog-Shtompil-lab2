<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Мої улюблені місця{% endblock %}</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background-color: #f4f4f9;
            color: #333;
        }
        header {
            background-color: #6a0dad;
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        header h2 { margin: 0; }
        header a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-weight: 500;
            font-size: 1.1rem;
        }
        header a:hover { text-decoration: underline; }
        main {
            flex: 1;
            padding: 2rem;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
        }
        footer {
            background-color: #2c2c2c;
            color: white;
            text-align: center;
            padding: 1.5rem;
            margin-top: auto;
        }
        .btn {
            display: inline-block;
            background-color: #ff9800;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }
        .btn:hover { background-color: #e68a00; }
    </style>
</head>
<body>

    <header>
        <h2>Куди піти?</h2>
        <nav>
            <a href="/">Головна</a>
            <a href="/places/">Список місць</a>
            <a href="/add/">Додати місце</a>
        </nav>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>Роботу виконала Штомпіль Владислава</p>
    </footer>

</body>
</html>
